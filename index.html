<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Planet Gold — Disparo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, sans-serif; color: #fff; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 10px 12px; pointer-events: none;
    }
    .box { background: rgba(0,0,0,.5); border: 1px solid #d4af37; border-radius: 10px; padding: 8px 10px; pointer-events: auto; }
    .hp { width: 38vw; max-width: 200px; }
    .bar { height: 10px; background: #333; border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .fill { height: 100%; background: linear-gradient(90deg,#e74c3c,#f1c40f); width: 100%; }
    #turn { text-align: center; font-weight: 800; color: #ffe08a; min-width: 96px; }
    #bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 10px 12px 16px; background: linear-gradient(transparent, rgba(0,0,0,.8));
    }
    .row { display: flex; gap: 8px; align-items: center; }
    label { font-size: 12px; color: #ffe08a; width: 58px; }
    input[type=range] { flex: 1; }
    #powerWrap { height: 16px; background: #222; border-radius: 8px; overflow: hidden; flex: 1; border: 1px solid #d4af37; }
    #powerFill { height: 100%; width: 0%; background: linear-gradient(90deg,#2ecc71,#f1c40f,#e74c3c); }
    button.main {
      width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 12px;
      background: #d4af37; color: #1a1200; font-weight: 800; font-size: 15px;
    }
    button.main:disabled { opacity: .45; }
    #msg { text-align: center; margin-top: 6px; min-height: 18px; font-size: 13px; color: #ffe08a; }
    canvas { display: block; width: 100%; height: 100%; }
    #pick {
      position: fixed; inset: 0; z-index: 19; background: #0b1020;
      display: none; flex-direction: column; padding: 16px 12px 20px;
    }
    #pick h1 { margin: 0 0 6px; font-size: 22px; color: #ffe08a; text-align: center; }
    #pick p { margin: 0 0 12px; text-align: center; color: #bbb; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow: auto; }
    .card {
      border: 2px solid #d4af37; border-radius: 14px; padding: 10px;
      background: #161a26; text-align: center; cursor: pointer;
    }
    .card.on { outline: 3px solid #fff; }
    .swatch { height: 54px; border-radius: 10px; margin-bottom: 8px; }
    .card img { width: 100%; height: 148px; object-fit: cover; object-position: top; border-radius: 10px; margin-bottom: 8px; background: #111; display: block; }
    .card b { display: block; }
    .card small { color: #aaa; }
    #go { margin-top: 12px; }
    #home, #wallet {
      position: fixed; inset: 0; z-index: 18; background: #0b1020;
      display: none; flex-direction: column; padding: 16px 14px 88px;
      overflow: auto;
    }
    #home.on, #wallet.on, #pick.on { display: flex; }
    #pick { z-index: 19; padding-bottom: 88px; }
    .heroBan {
      background: linear-gradient(135deg,#1a1408,#2b2110);
      border: 1px solid #d4af37; border-radius: 16px; padding: 16px;
    }
    .heroBan h2 { margin: 0; color: #ffe08a; font-size: 15px; font-weight: 600; }
    .heroBan .big { font-size: 28px; font-weight: 800; margin: 8px 0 4px; }
    .muted { color: #9aa0b4; font-size: 13px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 16px 0; }
    .act { background: #161a26; border: 1px solid #3a4258; border-radius: 14px; padding: 14px 8px; text-align: center; font-size: 12px; }
    .act b { display: block; font-size: 20px; margin-bottom: 4px; }
    input.wal { width: 100%; margin: 10px 0; padding: 12px; border-radius: 10px; border: 1px solid #3a4258; background: #12141c; color: #fff; }
    #nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      display: flex; background: #0e1220; border-top: 1px solid #2a3146;
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }
    #nav button {
      flex: 1; background: none; border: 0; color: #8b90a5; font-size: 11px; padding: 8px 4px;
    }
    #nav button.on { color: #ffe08a; font-weight: 700; }
    #arena { display: none; height: 100%; }
    #arena.on { display: block; }
    #bottom { bottom: 62px; }
    .card img { object-position: center 18%; }

  </style>
</head>
<body>
  <div id="home" class="on">
    <div class="heroBan">
      <h2>PLANET GOLD</h2>
      <div class="big" id="homePts">0 pts</div>
      <div class="muted">tgold pendiente: <b id="homePend">0</b></div>
    </div>
    <div class="actions">
      <div class="act" data-tab="pick"><b>🃏</b>Cartas</div>
      <div class="act" data-tab="pick"><b>▶️</b>Jugar</div>
      <div class="act" data-tab="wallet"><b>💰</b>Cobrar</div>
    </div>
    <p class="muted">Gana partidas para sumar puntos. Al cobrar envías tgold a tu wallet Solana.</p>
    <button class="main" data-tab="pick">EMPEZAR PARTIDA</button>
  </div>

  <div id="pick">
    <h1>PLANET GOLD</h1>
    <p>Elige ficha · marco oro</p>
    <div class="grid" id="grid"></div>
    <button class="main" id="go">JUGAR</button>
  </div>

  <div id="wallet">
    <h1 style="color:#ffe08a;text-align:center">Cobrar</h1>
    <p class="muted" style="text-align:center">Pega tu wallet de Solana (la de recibir tgold)</p>
    <div class="heroBan">
      <div class="muted">Pendiente</div>
      <div class="big" id="walPend">0</div>
    </div>
    <input class="wal" id="walletIn" placeholder="Wallet Solana" />
    <button class="main" id="claimBtn">RECLAMAR TGOLD</button>
    <p class="muted" id="claimMsg" style="text-align:center;margin-top:10px"></p>
  </div>

  <div id="arena">

  <div id="hud">
    <div class="box hp"><span id="meName">TÚ</span><div class="bar"><div id="hpMe" class="fill"></div></div></div>
    <div class="box" id="turn">TU TURNO</div>
    <div class="box hp" style="text-align:right">PORTERÍA<div class="bar"><div id="hpEn" class="fill"></div></div></div>
  </div>
  <canvas id="c"></canvas>
  <div id="bottom">
    <div class="row"><label>Ángulo</label><input id="ang" type="range" min="12" max="78" value="38" /></div>
    <div class="row" style="margin-top:8px"><label>Potencia</label><div id="powerWrap"><div id="powerFill"></div></div></div>
    <button class="main" id="fire">MANTÉN PARA CARGAR · SUELTA PARA DISPARAR</button>
    <div id="msg">Elige ángulo y carga</div>
  </div>

  </div>
  <nav id="nav">
    <button data-tab="home" class="on">Inicio</button>
    <button data-tab="pick">Jugar</button>
    <button data-tab="pick">Cartas</button>
    <button data-tab="wallet">Cobrar</button>
  </nav>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const HEROES = [
      { id: "capitan", name: "Capitán", role: "potencia", img: "cards/capitan.jpg", sprite: "cards/sprite-capitan.jpg", shirt: "#c0392b", shorts: "#1e7a3a", skin: "#e0ac69", hair: "#2b1b12", dmg: 1.25 },
      { id: "diez", name: "Diez", role: "preciso", img: "cards/diez.jpg", sprite: "cards/sprite-diez.jpg", shirt: "#5dade2", shorts: "#111", skin: "#e0ac69", hair: "#5a3a22", dmg: 1.05, acc: 1.15 },
      { id: "samba", name: "Samba", role: "efecto", img: "cards/samba.jpg", sprite: "cards/sprite-samba.jpg", shirt: "#f1c40f", shorts: "#1e7a3a", skin: "#8d5524", hair: "#1a1a1a", dmg: 1.1 },
      { id: "pibe", name: "Pibe", role: "sube rango", img: "cards/pibe.jpg", sprite: "cards/sprite-pibe.jpg", shirt: "#1f4e79", shorts: "#1a365d", skin: "#c68642", hair: "#111", dmg: 1.0 },
      { id: "rayo", name: "Rayo", role: "rápido", img: "cards/rayo.jpg", sprite: "cards/sprite-rayo.jpg", shirt: "#f5f5f5", shorts: "#f5f5f5", skin: "#8d5524", hair: "#111", dmg: 0.95, spd: 1.2 }
    ];

    const heroImg = {};
    const heroSprite = {};
    HEROES.forEach(h => {
      const im = new Image();
      im.src = h.img;
      heroImg[h.id] = im;
      const sp = new Image();
      sp.src = h.sprite || h.img;
      heroSprite[h.id] = sp;
    });


    function showTab(name) {
      ["home","pick","wallet","arena"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle("on", id === name);
      });
      document.querySelectorAll("#nav button").forEach(b => {
        b.classList.toggle("on", b.getAttribute("data-tab") === name || (name==="arena" && b.getAttribute("data-tab")==="pick"));
      });
      if (name === "home") refreshHome();
      if (name === "wallet") {
        document.getElementById("walPend").textContent = Number(localStorage.getItem("pg_pend")||0);
        document.getElementById("walletIn").value = localStorage.getItem("pg_wallet")||"";
      }
    }
    function refreshHome() {
      document.getElementById("homePts").textContent = (localStorage.getItem("pg_pts")||0) + " pts";
      document.getElementById("homePend").textContent = localStorage.getItem("pg_pend")||0;
    }
    document.querySelectorAll("[data-tab]").forEach(el => {
      el.addEventListener("click", () => showTab(el.getAttribute("data-tab")));
    });
    refreshHome();

    document.getElementById("claimBtn").onclick = async () => {
      const w = document.getElementById("walletIn").value.trim();
      const msg = document.getElementById("claimMsg");
      if (w.length < 32) { msg.textContent = "Wallet inválida"; return; }
      localStorage.setItem("pg_wallet", w);
      msg.textContent = "Enviando…";
      try {
        const r = await fetch("/api/claim", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ wallet: w })
        });
        const j = await r.json();
        if (j.ok) {
          localStorage.setItem("pg_pend", "0");
          document.getElementById("walPend").textContent = "0";
          msg.textContent = "Enviado. " + (j.sig||"").slice(0,18);
        } else msg.textContent = j.error || "Error";
      } catch(e) { msg.textContent = "Error de red"; }
    };

    let hero = HEROES[0];
    const grid = document.getElementById("grid");
    HEROES.forEach(h => {
      const el = document.createElement("div");
      el.className = "card" + (h.id === hero.id ? " on" : "");
      el.innerHTML = `<img src="${h.img}" alt="${h.name}" /><b>${h.name}</b><small>${h.role}</small>`;
      el.onclick = () => {
        hero = h;
        document.querySelectorAll(".card").forEach(c => c.classList.remove("on"));
        el.classList.add("on");
      };
      grid.appendChild(el);
    });
    document.getElementById("go").onclick = () => {
      showTab("arena");
      document.getElementById("meName").textContent = "TÚ · " + hero.name;
      reset(false);
    };

    const cvs = document.getElementById("c");
    const ctx = cvs.getContext("2d");
    const angEl = document.getElementById("ang");
    const pFill = document.getElementById("powerFill");
    const fireBtn = document.getElementById("fire");
    const msg = document.getElementById("msg");
    const turnEl = document.getElementById("turn");

    let W, H, ground;
    function resize() {
      W = cvs.width = innerWidth * devicePixelRatio;
      H = cvs.height = innerHeight * devicePixelRatio;
      cvs.style.width = innerWidth + "px";
      cvs.style.height = innerHeight + "px";
      ground = H * 0.76;
    }
    addEventListener("resize", resize);
    resize();

    const state = {
      meHp: 100, enHp: 100, turn: "me",
      power: 0, charging: false, shot: null,
      pts: Number(localStorage.getItem("pg_pts") || 0),
      wind: 0, boom: null
    };

    const me = { x: () => W * 0.16, y: () => ground - 8 };
    const en = { x: () => W * 0.84, y: () => ground - 78 };

    function setHp() {
      document.getElementById("hpMe").style.width = state.meHp + "%";
      document.getElementById("hpEn").style.width = state.enHp + "%";
    }

    let hold = null;
    function startCharge(e) {
      if (state.turn !== "me" || state.shot) return;
      e.preventDefault();
      state.charging = true; state.power = 8;
      hold = setInterval(() => {
        const extra = hero.spd || 1;
        state.power = Math.min(100, state.power + 1.5 * extra);
        pFill.style.width = state.power + "%";
      }, 16);
    }
    function release() {
      if (!state.charging) return;
      clearInterval(hold); state.charging = false;
      shoot("me", Number(angEl.value), state.power);
    }
    fireBtn.addEventListener("touchstart", startCharge, { passive: false });
    fireBtn.addEventListener("mousedown", startCharge);
    fireBtn.addEventListener("touchend", release);
    fireBtn.addEventListener("mouseup", release);

    function shoot(who, deg, pwr) {
      const fromMe = who === "me";
      const rad = (fromMe ? deg : 180 - deg) * Math.PI / 180;
      const speed = 7.2 + pwr / 6.6;
      const sx = fromMe ? me.x() + 22 : en.x() - 22;
      const sy = fromMe ? me.y() - 30 : en.y() + 18;
      state.shot = { who, x: sx, y: sy, vx: Math.cos(rad) * speed, vy: -Math.sin(rad) * speed, r: 10 };
      fireBtn.disabled = true;
      msg.textContent = fromMe ? hero.name + " dispara…" : "¡La portería responde!";
    }

    function boomAt(x, y) { state.boom = { x, y, t: 18 }; }

    function hitTest() {
      const s = state.shot;
      if (!s) return;
      if (s.who === "me") {
        const dx = s.x - en.x(), dy = s.y - (en.y() + 26);
        const rad = 58 * (hero.acc || 1);
        if (Math.hypot(dx, dy) < rad) {
          const dmg = Math.round((20 + state.power / 4.5) * hero.dmg);
          state.enHp = Math.max(0, state.enHp - dmg);
          setHp(); boomAt(en.x(), en.y() + 20);
          msg.textContent = "¡Impacto! -" + dmg;
          state.shot = null; afterShot();
        }
      } else {
        const dx = s.x - me.x(), dy = s.y - (me.y() - 22);
        if (Math.hypot(dx, dy) < 38) {
          const dmg = 11 + Math.round(Math.random() * 9);
          state.meHp = Math.max(0, state.meHp - dmg);
          setHp(); boomAt(me.x(), me.y() - 20);
          msg.textContent = "Te han dado -" + dmg;
          state.shot = null; afterShot();
        }
      }
      if (s && (s.y > ground + 10 || s.x < -20 || s.x > W + 20)) {
        boomAt(s.x, Math.min(s.y, ground));
        msg.textContent = "Falló…";
        state.shot = null; afterShot();
      }
    }

    function afterShot() {
      if (state.enHp <= 0) {
        state.pts += 500;
        localStorage.setItem("pg_pts", state.pts);
        const pend = Number(localStorage.getItem("pg_pend")||0) + 1;
        localStorage.setItem("pg_pend", pend);
        turnEl.textContent = "VICTORIA";
        msg.textContent = "+500 pts · total " + state.pts;
        fireBtn.textContent = "OTRA RONDA";
        fireBtn.disabled = false;
        fireBtn.onclick = () => reset(true);
        return;
      }
      if (state.meHp <= 0) {
        turnEl.textContent = "DERROTA";
        msg.textContent = "No hubo gol.";
        fireBtn.textContent = "REINTENTAR";
        fireBtn.disabled = false;
        fireBtn.onclick = () => reset(true);
        return;
      }
      if (state.turn === "me") {
        state.turn = "en";
        turnEl.textContent = "PORTERÍA";
        setTimeout(enemyTurn, 650);
      } else {
        state.turn = "me";
        turnEl.textContent = "TU TURNO";
        fireBtn.disabled = false;
        fireBtn.textContent = "MANTÉN PARA CARGAR · SUELTA PARA DISPARAR";
        fireBtn.onclick = null;
        state.power = 0; pFill.style.width = "0%";
      }
    }

    function enemyTurn() {
      shoot("en", 30 + Math.random() * 20, 48 + Math.random() * 36);
    }

    function reset(keepHero) {
      state.meHp = 100; state.enHp = 100;
      state.turn = "me"; state.shot = null; state.power = 0;
      state.wind = (Math.random() * 2 - 1) * 0.1;
      pFill.style.width = "0%";
      setHp();
      turnEl.textContent = "TU TURNO";
      fireBtn.textContent = "MANTÉN PARA CARGAR · SUELTA PARA DISPARAR";
      fireBtn.disabled = false;
      fireBtn.onclick = null;
      msg.textContent = hero.name + " · " + state.pts + " pts";
      if (!keepHero) document.getElementById("meName").textContent = "TÚ · " + hero.name;
    }

    let tick = 0;
    function drawBall(x, y, r, rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot || 0);
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#111";
      ctx.lineWidth = Math.max(2, r / 5);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const a = i * Math.PI * 2 / 5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.32, Math.sin(a) * r * 0.32);
        ctx.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawHero(x, y) {
      const s = Math.max(1, devicePixelRatio);
      const bob = Math.sin(tick / 12) * 5;
      const kick = state.charging ? -0.1 : (state.shot && state.shot.who === "me" ? 0.16 : 0);
      ctx.fillStyle = "#6b4a22";
      ctx.fillRect(x - 50, y, 100, 14);
      const im = heroSprite[hero.id] || heroImg[hero.id];
      const iw = 100 * s, ih = 130 * s;
      ctx.save();
      ctx.translate(x, y - 6 + bob);
      ctx.rotate(kick);
      if (im && im.complete && im.naturalWidth) {
        ctx.drawImage(im, -iw / 2, -ih, iw, ih);
      } else {
        ctx.fillStyle = hero.shirt;
        ctx.fillRect(-28, -78, 56, 78);
      }
      ctx.restore();
    }

    function drawShip(x, y) {
      const post = 10;
      const gw = 92, gh = 110;
      ctx.fillStyle = "#eee";
      ctx.fillRect(x - gw/2, y - 20, post, gh);
      ctx.fillRect(x + gw/2 - post, y - 20, post, gh);
      ctx.fillRect(x - gw/2, y - 20, gw, post);
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 2;
      for (let i = 0; i <= 6; i++) {
        const px = x - gw/2 + 8 + i * ((gw-16)/6);
        ctx.beginPath(); ctx.moveTo(px, y - 10); ctx.lineTo(px, y + gh - 24); ctx.stroke();
      }
      for (let j = 0; j <= 5; j++) {
        const py = y - 10 + j * ((gh-14)/5);
        ctx.beginPath(); ctx.moveTo(x - gw/2 + 8, py); ctx.lineTo(x + gw/2 - 8, py); ctx.stroke();
      }
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(x - gw/2 - 6, y + gh - 24, gw + 12, 10);
    }

    function draw() {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#2a1a3a"); sky.addColorStop(.55, "#c0392b"); sky.addColorStop(1, "#f39c12");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "rgba(255,255,255,.15)";
      ctx.beginPath(); ctx.arc(W * 0.78, H * 0.16, 46, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#2d1a0a";
      ctx.fillRect(0, ground, W, H - ground);
      ctx.fillStyle = "#1e7a3a";
      ctx.fillRect(0, ground, W, 12);

      drawHero(me.x(), me.y());
      drawShip(en.x(), en.y());

      const deg = Number(angEl.value) * Math.PI / 180;
      ctx.strokeStyle = "#ffe08a"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(me.x() + 18, me.y() - 40);
      ctx.lineTo(me.x() + 18 + Math.cos(deg) * 56, me.y() - 40 - Math.sin(deg) * 56);
      ctx.stroke();
      tick++;

      if (state.shot) {
        const s = state.shot;
        s.vy += 0.22;
        s.vx += state.wind;
        s.x += s.vx * devicePixelRatio * 0.55;
        s.y += s.vy * devicePixelRatio * 0.55;
        drawBall(s.x, s.y, s.r + 4, tick / 4);
        hitTest();
      }

      if (state.boom && state.boom.t > 0) {
        const b = state.boom; b.t--;
        ctx.fillStyle = "rgba(255,140,0," + (b.t / 18) + ")";
        ctx.beginPath(); ctx.arc(b.x, b.y, 18 + (18 - b.t) * 2, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
