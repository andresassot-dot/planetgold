<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Planet Gold</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg:#12141c; --card:#1c2030; --line:#d4af37; --text:#f3ead2; --muted:#9aa0b4; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    header { padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
    .gold { color:var(--line); font-weight:700; }
    .card { margin:12px; background:var(--card); border:1px solid #2a3146; border-radius:14px; padding:16px; }
    .map { position:relative; height:240px; border:2px solid var(--line); border-radius:12px; overflow:hidden; background:repeating-linear-gradient(45deg,#1a1f2e 0 12px,#161a26 12px 24px); }
    .hero { position:absolute; width:28px; height:28px; margin-left:-14px; margin-top:-14px; border-radius:6px; background:#4aa3ff; border:2px solid #fff; display:grid; place-items:center; transition:left .25s linear, top .25s linear; }
    .tree { position:absolute; font-size:22px; pointer-events:none; }
    button { width:100%; margin-top:10px; padding:12px; border:0; border-radius:10px; background:var(--line); color:#1a1404; font-weight:800; }
    .row { display:flex; gap:8px; }
    .row button { background:#2b3146; color:var(--text); }
    .muted { color:var(--muted); font-size:13px; word-break:break-all; }
    input { width:100%; margin-top:8px; padding:10px; border-radius:8px; border:1px solid #3a4258; background:#12141c; color:var(--text); }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="gold">PLANET GOLD</div>
      <div class="muted" id="user">Cargando jugador...</div>
    </div>
    <div class="gold" id="points">0 pts</div>
  </header>
  <section class="card" style="padding:12px;">
    <div class="map" id="map">
      <div class="tree" style="left:18%;top:22%">🌳</div>
      <div class="tree" style="left:62%;top:18%">🌳</div>
      <div class="tree" style="left:40%;top:58%">🪨</div>
      <div class="hero" id="hero">🙂</div>
    </div>
    <div class="muted" style="margin-top:8px">Toca el mapa para moverte y recolectar</div>
  </section>
  <section class="card">
    <div>tgold pendiente: <b id="pending">0</b></div>
    <div class="muted">10.000 pts = 1 tgold</div>
    <div class="muted" id="walletLabel">Wallet: no guardada</div>
    <input id="walletInput" placeholder="Pega tu wallet de Solana" />
    <button id="saveWallet">Guardar wallet</button>
    <button id="collect">Recolectar</button>
    <div class="row">
      <button id="jup">Comprar tgold</button>
      <button id="claim">CLAIM tgold</button>
    </div>
    <p class="muted" id="msg">
