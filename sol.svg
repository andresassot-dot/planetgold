  <path d="M104 72 C144 76 148 108 118 96 C138 102 122 118 106 88 Z" fill="#e8c15a" stroke="#8a6a12" stroke-width="1.2"/>
  <!-- coin -->
  <circle cx="80" cy="72" r="38" fill="#1a1028" filter="url(#glow)"/>
  <circle cx="80" cy="72" r="34" fill="url(#sol)"/>
  <circle cx="80" cy="72" r="34" fill="none" stroke="#fff6c8" stroke-width="2" opacity=".55"/>
